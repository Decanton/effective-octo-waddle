# What to search for. Edit freely; the agent reads this every run.
max_age_hours: 24            # strict: older or undated jobs are dropped

# Each search runs on every site in `sites`. Track is a hint for CV tailoring.
searches:
  - {term: "AI trainer", track: ai_data}
  - {term: "LLM evaluation", track: ai_data}
  - {term: "data annotation", track: ai_data}
  - {term: "prompt engineer", track: ai_data}
  - {term: "AI data specialist", track: ai_data}
  - {term: "backend engineer python", track: software}
  - {term: "software engineer", track: software}
  - {term: "integration engineer HL7", track: software}
  - {term: "oracle PL/SQL developer", track: software}
  - {term: "mechanical engineer", track: mechanical}

# Where to look. jobspy has no Indeed/Glassdoor support for Kenya, so LinkedIn
# carries most of the load: Kenya, plus remote roles open worldwide.
locations:
  - {location: "Kenya", remote_only: false}
  - {location: "Worldwide", remote_only: true}

jobspy:
  sites: [linkedin]          # add "indeed", "google" if you want; see README
  results_per_search: 25
  linkedin_details_top_n: 60 # fetch applicant count + exact age for this many LinkedIn jobs
  request_pause_seconds: 2.0

# Jobs are dropped if any of these appear in the title (case-insensitive).
title_exclude: [director, "vice president", "vp ", "head of", principal, "staff engineer", intern, internship, sales, recruiter, "account executive", nurse, teacher, driver]

# Jobs are dropped if any of these appear in the description.
description_knockouts:
  - "security clearance"
  - "us citizen"
  - "u.s. citizen"
  - "must be located in the us"
  - "must reside in the united states"
  - "authorized to work in the united states without"
  - "green card"
  - "eu work permit required"

# A non-remote job is kept only if its location matches one of these.
onsite_locations_ok: [kenya, nairobi]

# For remote jobs, drop ones restricted to regions you can't work from.
remote_region_exclude: ["us only", "usa only", "united states only", "us-based", "uk only", "canada only", "eu only", "europe only"]
