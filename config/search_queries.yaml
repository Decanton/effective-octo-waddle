# What to search for. Edit freely; the agent reads this every run.
max_age_hours: 24            # strict: older or undated jobs are dropped

# Optional longer limits for company job boards, whose forms the agent can fill.
# Example: {greenhouse: 72, lever: 72, ashby: 72}. Empty means 24 hours everywhere.
max_age_hours_by_source: {}

# Each search runs on every site in `sites`. Track is a hint for CV tailoring.
searches:
  - {term: '"AI trainer" OR "LLM evaluation" OR "data annotation" OR "AI data specialist"', track: ai_data}
  - {term: '"prompt engineer" OR "AI tutor" OR "RLHF" OR "model evaluation"', track: ai_data}
  - {term: '"backend engineer" OR "python developer" OR "software engineer"', track: software}
  - {term: '"integration engineer" OR "HL7" OR "PL/SQL developer"', track: software}
  - {term: '"mechanical engineer" OR "design engineer" OR "maintenance engineer"', track: mechanical}

# Free remote-job boards with exact posting times (see src/discovery/remote_boards.py).
remote_boards: [remotive, remoteok, himalayas, jobicy, weworkremotely]

# Where to look. jobspy has no Indeed/Glassdoor support for Kenya, so LinkedIn
# carries most of the load: Kenya, plus remote roles open worldwide.
locations:
  - {location: "Kenya", remote_only: false}
  - {location: "Worldwide", remote_only: true}

jobspy:
  sites: [linkedin]          # add "indeed", "google" if you want; see README
  results_per_search: 25
  linkedin_details_top_n: 30 # fetch applicant count + exact age for this many LinkedIn jobs
  request_pause_seconds: 8.0
  stop_after_empty_searches: 3  # LinkedIn blocks fast scrapers; give up for the day after 3 empty searches

# Jobs are dropped if any of these appear in the title (case-insensitive).
title_exclude: [director, "vice president", "vp ", "head of", principal, staff, intern, internship, sales, recruiter, "account executive", nurse, teacher, driver]

# Jobs are dropped if any of these appear in the description.
description_knockouts:
  - "security clearance"
  - "us citizen"
  - "u.s. citizen"
  - "must be located in the us"
  - "must reside in the united states"
  - "authorized to work in the united states without"
  - "green card"
  - "eu work permit required"

# A non-remote job is kept only if its location matches one of these.
onsite_locations_ok: [kenya, nairobi]

# For remote jobs, drop ones restricted to regions you can't work from.
remote_region_exclude: ["us only", "usa only", "united states only", "us-based", "uk only", "canada only", "eu only", "europe only"]

# A remote job whose location names a specific place is kept only if that
# place matches one of these. "Remote" alone, or an empty location, is kept.
remote_locations_ok: [kenya, nairobi, africa, emea, worldwide, anywhere, global, international]
