# How far the agent goes on its own. Edit and save; the next run uses it.

auto_submit:
  # true: after filling forms, the agent sends every application that is
  # complete, without waiting for you. false: they wait on the review page.
  enabled: true
  # Never send more than this many applications in one day.
  max_per_day: 20
  # Only send on these application systems (their forms are standard and
  # show a clear "application received" page).
  only_hosts: [greenhouse.io, lever.co, ashbyhq.com, workable.com, smartrecruiters.com, jobvite.com,
               bamboohr.com, recruitee.com, teamtailor.com, personio.de, personio.com, breezy.hr,
               applytojob.com, icims.com, myworkdayjobs.com, rippling.com, pinpointhq.com, freshteam.com]
  # Many forms have a required "I agree to the privacy policy" box.
  # false: those forms wait for you on the review page.
  # true: the agent ticks required privacy/consent boxes for you.
  accept_required_consents: false
  # Forms with a CAPTCHA need a person; they always wait for you.
  # Seconds to wait for the "thank you" page after pressing Submit.
  confirm_wait_seconds: 60

email_applications:
  # Jobs that say "send your CV and cover letter to hr@...": the agent emails your
  # tailored CV and a cover letter (facts from your profile only) from EMAIL_ADDRESS.
  # true: sent automatically. false: they wait on the review page for Submit.
  enabled: true
  # Never email more than this many applications in one day.
  max_per_day: 10

google_sign_in:
  # When a job site wants an account, click its "Continue with Google" button and
  # pick EMAIL_ADDRESS. Needs one Google sign-in first: START_SPRINT.bat --login-setup.
  # The agent never types a password; if Google asks for one, the job waits for you.
  enabled: true
  # true: also press Google's "Continue" on first use, which creates your account
  # on that job site with your Google name and email.
  allow_new_accounts: true

recruiter_replies:
  # true: replies to recruiter emails are sent automatically when the draft is
  # complete (no [FILL IN ...] gap left). Drafts that need your times, salary and
  # so on always wait on the Recruiter emails tab.
  auto_send: true
  max_per_day: 10
  # These kinds of email always wait for you.
  skip_categories: [rejection, offer]

portal_accounts:
  # When a company's application site needs its own account (Workday, iCIMS and others),
  # create one with EMAIL_ADDRESS and a strong random password, stored encrypted for
  # your Windows user only (table portal_credentials), then read the 6-digit code or
  # activation link from your inbox and finish the sign-up. Next time it signs in.
  enabled: true
  # Sign-up forms usually require accepting the site's terms. true: tick that box.
  accept_terms: true
  # How long to wait for the verification email.
  code_wait_seconds: 60

browser:
  # Drive your "Job Agent Chrome" over a local debugging connection (port below), so
  # sign-ins and open tabs are shared. It starts Chrome itself when it isn't running.
  use_cdp: true
  cdp_port: 9222

email:
  # Read job alerts and recruiter messages from the inbox in .env (EMAIL_ADDRESS).
  enabled: true
  # Only look at mail from the last N hours (job alerts older than a day are stale anyway).
  lookback_hours: 24

human_assist:
  # CAPTCHAs and phone (SMS) codes. The agent never solves a CAPTCHA.
  enabled: true
  # false (default): runs unattended, even overnight. A job behind a CAPTCHA is skipped
  # at once and put on the optional "CAPTCHA" list; nothing ever waits for you.
  # true: bring the tab to the front with an alert and chime, and wait for you.
  attended: false
  # When attended: how long to wait before moving on.
  wait_seconds: 120
  # With Google Messages for Web open in Job Agent Chrome (paired with your phone), the
  # agent reads the new SMS code itself. Money messages (M-PESA, bank) are never used.
  sms_wait_seconds: 10
  # Open Google Messages in Job Agent Chrome whenever the agent starts it.
  keep_messages_open: true
  # A steady pace between form steps, so sites aren't hammered.
  pacing:
    between_steps_seconds: [1.5, 4.0]
    between_fields_seconds: [0.2, 0.6]

update:
  # Install new versions from GitHub by itself. The tests run on the new version first;
  # if any fail, the current version stays. Your .env, .venv and data are never touched.
  # The review page switches to the new version without going offline.
  enabled: true
  # Check before each daily run, and every N minutes while the review page is open.
  on_run: true
  check_minutes: 60
  run_tests: true
  branch: main
  repo: https://github.com/Decanton/effective-octo-waddle.git

llm:
  # Which AI writes cover letters, written answers and recruiter replies.
  # cloud:      Gemini, then Groq, then Ollama (free keys in .env). See docs/AI_DATA.md for what they see.
  # local_only: only Ollama on this laptop (install from ollama.com, set OLLAMA_MODEL in .env). Nothing leaves the laptop.
  # off:        no AI; template letters, and written questions wait for you.
  mode: cloud

follow_ups:
  # One polite follow-up email for email applications with no answer after `after_days`.
  # Never for forms, never to mailers, never twice, and not once the company has replied.
  enabled: true
  after_days: 7
  auto_send: true
  max_per_day: 10
