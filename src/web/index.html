<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Sprint Review</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#1f3a5f;
          --ok:#127a46; --warn:#b54708; --bad:#b42318; --chip:#eef2f6; --sel:#e8eef7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --panel:#1a1f26; --text:#e6e9ee; --muted:#98a2b3;
          --line:#2c333d; --accent:#8fb3e6; --ok:#4cc38a; --warn:#f5a524; --bad:#f97066; --chip:#232a33; --sel:#22324a; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .tabs button { background:none; border:0; padding:6px 10px; color:var(--muted); cursor:pointer; font:inherit; border-radius:6px; }
  .tabs button.on { background:var(--sel); color:var(--text); font-weight:600; }
  #counts { margin-left:auto; color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns:minmax(260px, 360px) 1fr; height:calc(100vh - 54px); }
  #list { overflow:auto; border-right:1px solid var(--line); background:var(--panel); }
  .item { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item.on { background:var(--sel); }
  .item .t { font-weight:600; }
  .item .c { color:var(--muted); font-size:13px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chip { background:var(--chip); border-radius:999px; padding:1px 8px; font-size:12px; }
  .chip.ok { color:var(--ok); } .chip.warn { color:var(--warn); } .chip.bad { color:var(--bad); }
  #detail { overflow:auto; padding:18px 24px 80px; }
  #detail h2 { margin:0 0 4px; font-size:20px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--text); padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; text-decoration:none; }
  .btn.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  table { border-collapse:collapse; width:100%; margin:8px 0 16px; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.v input, td.v textarea, td.v select { width:100%; font:inherit; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); }
  td.v textarea { min-height:90px; }
  .need { color:var(--warn); font-weight:600; }
  .note { color:var(--muted); font-size:12px; }
  img.shot { max-width:100%; border:1px solid var(--line); border-radius:8px; }
  #msg { position:fixed; bottom:16px; right:16px; background:var(--panel); border:1px solid var(--line); padding:10px 14px; border-radius:8px; display:none; max-width:420px; }
  .help { color:var(--muted); font-size:12px; }
  @media (max-width: 760px) { main { grid-template-columns:1fr; height:auto; } #list { max-height:40vh; } #detail { padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>Job Sprint review</h1>
  <div class="tabs"><button data-tab="jobs" class="on">Applications</button><button data-tab="emails">Recruiter emails</button><button data-tab="platforms">AI platforms</button></div>
  <span class="help">Keys: ↑/↓ move · Enter submit · Backspace skip</span>
  <span id="counts"></span>
  <button class="btn primary" id="sendall" title="Send every complete application now">Send all ready</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><p class="note">Loading…</p></div>
</main>
<div id="msg"></div>
<script>
let items = [], cur = 0, tab = "jobs", busy = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = (t, ms = 4000) => { const m = $("#msg"); m.textContent = t; m.style.display = "block"; clearTimeout(say.t); say.t = setTimeout(() => m.style.display = "none", ms); };
const CHIPS = { READY_TO_SUBMIT: '<span class="chip ok">ready</span>', NEEDS_USER_INPUT: '<span class="chip warn">needs you</span>',
  NEEDS_LOGIN: '<span class="chip warn">sign in once</span>', SENT_UNCONFIRMED: '<span class="chip warn">sent? check</span>' };
const stateChip = s => CHIPS[s] || '<span class="chip">apply yourself</span>';

async function load() {
  const [list, sum] = await Promise.all([fetch("/api/staged").then(r => r.json()), fetch("/api/summary").then(r => r.json())]);
  items = list; cur = Math.min(cur, Math.max(0, items.length - 1));
  const f = sum.forms;
  $("#counts").textContent = `${f.READY_TO_SUBMIT || 0} ready · ${f.NEEDS_USER_INPUT || 0} need you · ${f.MANUAL_APPLY || 0} apply yourself · ${f.NEEDS_LOGIN || 0} need a sign-in · ${(f.SUBMITTED || 0) + (f.SENT_UNCONFIRMED || 0)} sent`;
  render();
}

function render() {
  if (tab === "platforms") return renderPlatforms();
  if (tab === "emails") return renderEmails();
  $("#list").innerHTML = items.map((it, i) => `
    <div class="item ${i === cur ? "on" : ""}" data-i="${i}">
      <div class="t">${esc(it.title)}</div><div class="c">${esc(it.company || "")}</div>
      <div class="chips">${stateChip(it.state)}<span class="chip">${Math.round(it.age_hours)}h old</span>
        <span class="chip ${it.applicant_count != null && it.applicant_count <= 25 ? "ok" : ""}">${it.applicant_count == null ? "applicants ?" : it.applicant_count + " applicants"}</span>
        <span class="chip">${esc(it.track || "")}</span></div>
    </div>`).join("") || '<p class="note" style="padding:14px">Nothing staged yet. Run the sprint first.</p>';
  document.querySelectorAll(".item").forEach(el => el.onclick = () => { cur = +el.dataset.i; render(); });
  const it = items[cur];
  if (!it) { $("#detail").innerHTML = '<p class="note">Nothing to review.</p>'; return; }
  const rows = it.answers.map((a, k) => {
    let v;
    if (a.consent) v = `<label><input type="checkbox" data-consent="${esc(a.label)}"> I agree (you must tick this yourself)</label>`;
    else if (a.kind === "file") v = esc(a.value || "") + (a.value ? "" : ' <span class="need">left empty</span>');
    else if (a.needs_user || a.source === "ai_draft") {
      if (a.options && a.options.length) v = `<select data-ov="${esc(a.label)}"><option value="">Choose…</option>${a.options.map(o => `<option ${o === a.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
      else if (a.kind === "textarea" || a.source === "ai_draft") v = `<textarea data-ov="${esc(a.label)}">${esc(a.value || "")}</textarea>`;
      else v = `<input data-ov="${esc(a.label)}" value="${esc(a.value || "")}">`;
    } else v = esc(a.value ?? "");
    const flag = a.needs_user ? '<span class="need">needs you</span>' : a.source === "ai_draft" ? '<span class="chip warn">AI draft</span>' : `<span class="note">${esc(a.source || "")}</span>`;
    return `<tr><td>${esc(a.label)}${a.required ? " *" : ""}<div class="note">${esc(a.note || "")}</div></td><td class="v">${v}</td><td>${flag}</td></tr>`;
  }).join("");
  const manual = ["MANUAL_APPLY", "NEEDS_LOGIN", "SENT_UNCONFIRMED"].includes(it.state);
  $("#detail").innerHTML = `
    <h2>${esc(it.title)}</h2>
    <div class="note">${esc(it.company || "")} · ${esc(it.location || "")} · priority ${(it.priority_score || 0).toFixed(2)} · fit ${(it.fit_score || 0).toFixed(2)} · from ${esc(it.source)}</div>
    <div class="row">
      ${manual ? `<a class="btn primary" href="${esc(it.form_url || it.url)}" target="_blank" rel="noopener">Open application</a>
                  <button class="btn" id="done">${it.state === "SENT_UNCONFIRMED" ? "Yes, it was sent" : "I applied myself"}</button>`
               : `<button class="btn primary" id="submit">Submit (Enter)</button>`}
      <button class="btn" id="skip">Skip (Backspace)</button>
      ${it.has_cv ? `<a class="btn" href="/files/cv/${it.id}">Download tailored CV</a>` : ""}
      <a class="btn" href="${esc(it.url)}" target="_blank" rel="noopener">Job post</a>
    </div>
    ${it.error ? `<p class="note">${esc(it.error)}</p>` : ""}
    ${it.missing.length ? `<p class="need">Fill these before submitting: ${it.missing.map(esc).join(", ")}</p>` : ""}
    ${it.matched_keywords ? `<p class="note">CV keywords matched: ${esc(it.matched_keywords)}</p>` : ""}
    ${rows ? `<table><tr><th>Question</th><th>Answer</th><th></th></tr>${rows}</table>` : ""}
    ${it.has_shot ? `<p class="note">Screenshot of the filled form, taken before Submit:</p><img class="shot" src="/files/screenshot/${it.id}" alt="Filled application form">` : ""}`;
  $("#skip").onclick = skip;
  if ($("#submit")) $("#submit").onclick = submit;
  if ($("#done")) $("#done").onclick = () => post(`/api/applied_myself/${it.id}`).then(() => { say("Marked as applied."); load(); });
}

$("#sendall").onclick = async () => {
  const n = items.filter(i => i.state === "READY_TO_SUBMIT").length;
  if (!n) return say("No complete applications to send.");
  if (!confirm(`Send all ${n} ready applications now? Forms with a CAPTCHA or a consent box you haven't allowed stay here.`)) return;
  try { await post("/api/submit_all"); } catch (e) { return say("Error: " + e.message, 8000); }
  say("Sending… browser windows open one by one. This page updates when it's done.", 600000);
  const poll = setInterval(async () => {
    const st = await fetch("/api/submit_all").then(r => r.json());
    if (!st.running) { clearInterval(poll); const r = st.result || {};
      say(`Done: ${r.sent || 0} sent, ${r.not_confirmed || 0} sent without a thank-you page, ${r.failed || 0} failed, ${r.waiting_for_you || 0} still need you.`, 15000); load(); }
  }, 4000);
};

let emails = [], ecur = 0;
async function renderEmails() {
  emails = await fetch("/api/emails").then(r => r.json());
  ecur = Math.min(ecur, Math.max(0, emails.length - 1));
  $("#list").innerHTML = emails.map((m, i) => `
    <div class="item ${i === ecur ? "on" : ""}" data-e="${i}">
      <div class="t">${esc(m.subject || "(no subject)")}</div><div class="c">${esc(m.from_name || m.from_addr)}</div>
      <div class="chips">${m.state === "SENT" ? '<span class="chip ok">replied</span>' : '<span class="chip warn">draft ready</span>'}
        <span class="chip">${esc((m.category || "other").replace("_", " "))}</span></div>
    </div>`).join("") || '<p class="note" style="padding:14px">No recruiter emails in the last day.</p>';
  document.querySelectorAll("[data-e]").forEach(el => el.onclick = () => { ecur = +el.dataset.e; renderEmails(); });
  const m = emails[ecur];
  if (!m) { $("#detail").innerHTML = '<p class="note">Nothing here yet.</p>'; return; }
  const sent = m.state === "SENT";
  $("#detail").innerHTML = `
    <h2>${esc(m.subject || "(no subject)")}</h2>
    <div class="note">From ${esc(m.from_name || "")} &lt;${esc(m.from_addr)}&gt; · ${esc(m.received_at || "")}</div>
    <pre style="white-space:pre-wrap;font:inherit;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:8px;max-height:40vh;overflow:auto">${esc(m.body_text || "")}</pre>
    <p class="note">${sent ? "Your reply (sent " + esc(m.sent_at) + "):" : "Draft reply. Edit it, replace any [FILL IN ...] gaps, then press Send. Nothing is sent until you do."}</p>
    <textarea id="reply" style="width:100%;min-height:220px" ${sent ? "readonly" : ""}>${esc(m.draft_reply || "")}</textarea>
    <div class="row">${sent ? "" : '<button class="btn primary" id="esend">Send reply</button><button class="btn" id="edismiss">Not a recruiter, hide</button>'}</div>`;
  if (!sent) {
    $("#esend").onclick = async () => {
      if (!confirm(`Send this reply to ${m.from_addr}?`)) return;
      try { const r = await post(`/api/emails/${m.id}/send`, { body: $("#reply").value }); say(r.ok ? "Reply sent." : "Not sent: " + r.error, 8000); }
      catch (e) { say("Error: " + e.message, 8000); }
      renderEmails();
    };
    $("#edismiss").onclick = () => post(`/api/emails/${m.id}/dismiss`).then(renderEmails);
  }
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

async function submit() {
  const it = items[cur]; if (!it || busy || !["READY_TO_SUBMIT", "NEEDS_USER_INPUT"].includes(it.state)) return;
  const overrides = {}, consents = [];
  document.querySelectorAll("[data-ov]").forEach(el => { if (el.value) overrides[el.dataset.ov] = el.value; });
  document.querySelectorAll("[data-consent]").forEach(el => { if (el.checked) consents.push(el.dataset.consent); });
  const unticked = [...document.querySelectorAll("[data-consent]")].filter(e => !e.checked).length;
  if (unticked && !confirm(`${unticked} consent box(es) are not ticked. The form may refuse to submit. Continue?`)) return;
  busy = true; say("Submitting… a browser window opens. Solve any CAPTCHA there.", 60000);
  try {
    const r = await post(`/api/submit/${it.id}`, { overrides, consents });
    say(r.ok ? "Submitted." : "Not submitted: " + (r.error || "unknown"), 8000);
  } catch (e) { say("Error: " + e.message, 8000); }
  busy = false; load();
}

async function skip() {
  const it = items[cur]; if (!it || busy) return;
  await post(`/api/skip/${it.id}`); say("Skipped."); load();
}

async function renderPlatforms() {
  const ps = await fetch("/api/platforms").then(r => r.json());
  $("#list").innerHTML = '<p class="note" style="padding:14px">These platforms take one standing application instead of dated job posts.</p>';
  $("#detail").innerHTML = `<h2>AI training platforms</h2><table><tr><th>Platform</th><th>Status</th><th></th></tr>${ps.map(p => `
    <tr><td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a></td><td>${esc(p.status)}</td>
    <td>${p.status === "NOT_APPLIED" ? `<button class="btn" data-p="${esc(p.name)}">Mark applied</button>` : ""}</td></tr>`).join("")}</table>`;
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => { await post(`/api/platforms/${encodeURIComponent(b.dataset.p)}`, { status: "APPLIED" }); renderPlatforms(); });
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); tab = b.dataset.tab; render();
});
document.addEventListener("keydown", e => {
  if (tab !== "jobs" || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
  if (e.key === "ArrowDown") { cur = Math.min(items.length - 1, cur + 1); render(); e.preventDefault(); }
  if (e.key === "ArrowUp") { cur = Math.max(0, cur - 1); render(); e.preventDefault(); }
  if (e.key === "Enter") { submit(); e.preventDefault(); }
  if (e.key === "Backspace") { skip(); e.preventDefault(); }
});
load();
</script>
</body>
</html>
