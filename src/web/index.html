<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Sprint Review</title>
<style>
  :root {
    --bg:#f4f6f8; --panel:#ffffff; --panel2:#f9fafb; --text:#18202b; --muted:#5f6b7a; --line:#e3e7ec;
    --accent:#2457c5; --accent-ink:#ffffff; --accent-soft:#e8effc;
    --ok:#127a46; --ok-soft:#e5f5ec; --warn:#a85a00; --warn-soft:#fdf1e2; --bad:#b42318; --bad-soft:#fdeceb;
    --info:#5b4bc4; --info-soft:#efedfb; --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0f1318; --panel:#171c23; --panel2:#1c232b; --text:#e7ebf0; --muted:#9aa6b4; --line:#2a323c;
    --accent:#7aa2f7; --accent-ink:#0f1318; --accent-soft:#1d2a44;
    --ok:#4cc38a; --ok-soft:#14291f; --warn:#f0a645; --warn-soft:#2e2416; --bad:#f97066; --bad-soft:#2f1b1a;
    --info:#a99cf5; --info-soft:#231f3a; --shadow:none; } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  a { color:var(--accent); }
  header { display:flex; align-items:center; gap:18px; padding:10px 20px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; }
  .logo { width:28px; height:28px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:14px; }
  nav { display:flex; gap:4px; }
  nav button { position:relative; background:none; border:0; padding:7px 12px; color:var(--muted); cursor:pointer; font:inherit; border-radius:8px; }
  nav button:hover { background:var(--panel2); color:var(--text); }
  nav button.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  nav .badge { margin-left:6px; background:var(--warn); color:var(--panel); border-radius:999px; padding:0 6px; font-size:11px; font-weight:700; }
  .hdr-actions { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:7px 13px; border-radius:8px; cursor:pointer; font:inherit; text-decoration:none; white-space:nowrap; }
  .btn:hover { border-color:var(--muted); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  .btn.ghost { border-color:transparent; background:none; color:var(--muted); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .stats { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:10px; padding:14px 20px 0; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; box-shadow:var(--shadow); cursor:pointer; text-align:left; font:inherit; color:inherit; }
  .stat:hover { border-color:var(--accent); }
  .stat .n { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat .l { color:var(--muted); font-size:12px; }
  .stat.ok .n { color:var(--ok); } .stat.warn .n { color:var(--warn); } .stat.info .n { color:var(--info); }
  button.link { background:none; border:0; padding:0; color:var(--accent, #2563eb); cursor:pointer; font:inherit; text-decoration:underline; }
  .autobar { display:flex; gap:14px; flex-wrap:wrap; align-items:center; padding:8px 20px 0; color:var(--muted); font-size:12px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; background:var(--muted); vertical-align:middle; }
  .dot.on { background:var(--ok); }
  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(280px, 380px) 1fr; gap:14px; padding:14px 20px 20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  #side { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .tools { padding:10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .search { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--text); font:inherit; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; }
  .filters button { border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; padding:2px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .filters button.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  #list { overflow:auto; flex:1; }
  .item { display:flex; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:var(--panel2); }
  .item.on { background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
  .av { flex:none; width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-weight:700; background:var(--panel2); border:1px solid var(--line); color:var(--muted); }
  .item .t { font-weight:600; line-height:1.3; }
  .item .c { color:var(--muted); font-size:12.5px; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
  .chip { background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:0 8px; font-size:11.5px; color:var(--muted); }
  .chip.ok { background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .chip.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
  .chip.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
  .chip.info { background:var(--info-soft); color:var(--info); border-color:transparent; }
  #detail { overflow:auto; padding:22px 26px 60px; min-height:0; }
  .dh { display:flex; gap:14px; align-items:flex-start; }
  .dh .av { width:46px; height:46px; font-size:18px; }
  #detail h2 { margin:0; font-size:20px; line-height:1.3; }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:16px 0; }
  .banner { border-radius:10px; padding:10px 14px; margin:14px 0; font-size:13.5px; border:1px solid transparent; }
  .banner.ok { background:var(--ok-soft); color:var(--ok); } .banner.warn { background:var(--warn-soft); color:var(--warn); }
  .banner.info { background:var(--info-soft); color:var(--info); } .banner.plain { background:var(--panel2); border-color:var(--line); color:var(--muted); }
  ul.req { margin:6px 0 10px 18px; padding:0; } ul.req li { margin:3px 0; } ul.req li.ok::marker { content:"✓  "; color:var(--ok, #1a7f37); } ul.req li.miss::marker { content:"✗  "; color:var(--warn, #b35900); }
  pre.post { white-space:pre-wrap; max-height:320px; overflow:auto; font:inherit; font-size:13px; background:var(--accent-soft); padding:10px; border-radius:8px; }
  .funnel { display:grid; gap:6px; margin:12px 0; } .fstep { display:grid; grid-template-columns:90px 1fr 40px; gap:8px; align-items:center; }
  .fbar { height:10px; background:var(--accent-soft); border-radius:6px; overflow:hidden; } .fbar i { display:block; height:100%; background:var(--accent); }
  .scores { display:flex; gap:18px; flex-wrap:wrap; margin:10px 0 0; }
  .score .l { color:var(--muted); font-size:11.5px; } .score .v { font-weight:700; font-variant-numeric:tabular-nums; }
  .bar { width:90px; height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:22px 0 8px; }
  table { border-collapse:collapse; width:100%; }
  td, th { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.q { width:38%; } td.flag { width:90px; text-align:right; }
  td.v input, td.v textarea, td.v select, textarea.big { width:100%; font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--text); }
  td.v textarea { min-height:100px; } textarea.big { min-height:240px; }
  .need { color:var(--warn); font-weight:600; }
  .note { color:var(--muted); font-size:12px; }
  details summary { cursor:pointer; color:var(--accent); margin:16px 0 8px; }
  img.shot { max-width:100%; border:1px solid var(--line); border-radius:10px; }
  pre.mail { white-space:pre-wrap; font:inherit; background:var(--panel2); border:1px solid var(--line); padding:12px 14px; border-radius:10px; max-height:38vh; overflow:auto; margin:0; }
  .empty { padding:40px 20px; text-align:center; color:var(--muted); }
  .empty b { display:block; color:var(--text); font-size:15px; margin-bottom:4px; }
  .kbd { font-size:11px; border:1px solid currentColor; border-radius:4px; padding:0 4px; opacity:.7; }
  nav button { white-space:nowrap; }
  #msg { position:fixed; bottom:18px; right:18px; background:var(--text); color:var(--panel); padding:10px 16px; border-radius:10px; display:none; max-width:440px; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:9; }
  @media (max-width: 1000px) { .stats { grid-template-columns:repeat(3, minmax(0,1fr)); } }
  @media (max-width: 760px) {
    header { padding:10px 16px; } .hdr-actions { margin-left:0; width:100%; }
    .stats { padding:12px 16px 0; grid-template-columns:repeat(2, minmax(0,1fr)); } .autobar { padding:8px 16px 0; }
    main { grid-template-columns:1fr; padding:12px 16px 16px; } #side { max-height:45vh; } #detail { padding:16px; }
    td.q { width:auto; } .dh .av { display:none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">JS</span>Job Sprint</div>
  <nav>
    <button data-tab="jobs" class="on">Applications</button>
    <button data-tab="emails">Recruiter emails<span class="badge" id="ebadge" hidden></span></button>
    <button data-tab="results">Results</button>
    <button data-tab="platforms">AI platforms</button>
  </nav>
  <div class="hdr-actions">
    <button class="btn" id="runlogin" title="Opens a browser where you sign in to Google and job sites once">Sign in to sites</button>
    <button class="btn" id="runsprint" title="Reads your inbox, finds new jobs, fills forms and sends the complete ones">Find &amp; apply now</button>
    <button class="btn primary" id="sendall" title="Submit every verified application now">Submit All Verified Jobs</button>
  </div>
</header>
<section class="stats" id="stats"></section>
<div class="autobar" id="autobar"></div>
<main>
  <aside class="card" id="side">
    <div class="tools">
      <input class="search" id="q" placeholder="Search title or company" aria-label="Search">
      <div class="filters" id="filters"></div>
    </div>
    <div id="list"></div>
  </aside>
  <section class="card" id="detail"><p class="note">Loading…</p></section>
</main>
<div id="msg" role="status"></div>
<script>
let items = [], cur = 0, tab = "jobs", busy = false, filter = "todo", query = "", summary = null;
let emails = [], ecur = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = (t, ms = 4000) => { const m = $("#msg"); m.textContent = t; m.style.display = "block"; clearTimeout(say.t); say.t = setTimeout(() => m.style.display = "none", ms); };
const initial = s => esc((String(s || "?").trim()[0] || "?").toUpperCase());
const isMail = it => (it.form_url || "").startsWith("mailto:");
const host = u => { try { return u.startsWith("mailto:") ? u.slice(7) : new URL(u).host.replace(/^www\./, ""); } catch { return ""; } };
const ago = iso => { if (!iso) return ""; const h = (Date.now() - new Date(iso)) / 36e5; return h < 1 ? "just now" : h < 24 ? `${Math.round(h)}h ago` : `${Math.round(h / 24)}d ago`; };

const STATE = {
  READY_TO_SUBMIT:  { chip: "ok",   label: "verified ready", group: "ready" },
  NEEDS_USER_INPUT: { chip: "warn", label: "needs you",      group: "needs" },
  NEEDS_LOGIN:      { chip: "info", label: "sign in once",   group: "login" },
  NEEDS_MANUAL_OTP: { chip: "warn", label: "CAPTCHA (optional)", group: "captcha" },
  MANUAL_APPLY:     { chip: "",     label: "apply yourself", group: "manual" },
  SENT_UNCONFIRMED: { chip: "warn", label: "sent? check",    group: "sent" },
  SUBMITTED:        { chip: "ok",   label: "sent",           group: "sent" },
};
const FILTERS = [["todo", "To do"], ["ready", "Verified"], ["needs", "Needs you"], ["login", "Sign in"], ["captcha", "CAPTCHA (optional)"], ["manual", "Apply yourself"], ["sent", "Sent"], ["all", "All"]];
const inFilter = it => { const g = (STATE[it.state] || {}).group; return filter === "all" || (filter === "todo" ? g !== "sent" : g === filter); };
const stateChip = s => { const d = STATE[s] || { chip: "", label: s }; return `<span class="chip ${d.chip}">${d.label}</span>`; };

let upd = null, firstCommit = null;
async function load() {
  const [list, sum, u] = await Promise.all([fetch("/api/staged").then(r => r.json()), fetch("/api/summary").then(r => r.json()),
    fetch("/api/update").then(r => r.ok ? r.json() : null).catch(() => null)]);
  items = list; summary = sum; upd = u;
  if (u && u.installed) {  // a new version was installed: reload once you're not in the middle of something
    if (firstCommit && u.installed !== firstCommit && !busy) return location.reload();
    firstCommit = firstCommit || u.installed;
  }
  renderTop(); render();
}
async function checkUpdate() {
  $("#autobar").querySelector("#updbtn").textContent = "Checking…";
  await fetch("/api/update", { method: "POST" }).catch(() => null);
  setTimeout(load, 4000);
}

function renderTop() {
  const f = summary.forms, st = summary.settings || {}, sent = summary.sent_today || {};
  const tiles = [["ready", "ok", f.READY_TO_SUBMIT, "Verified, ready to submit"], ["needs", "warn", f.NEEDS_USER_INPUT, "Need your answers"],
    ["login", "info", f.NEEDS_LOGIN, "Need a sign-in"], ["manual", "", f.MANUAL_APPLY, "Apply yourself"],
    ["sent", "ok", (sent.forms || 0) + (sent.email || 0), "Sent today"], ["sent", "", (f.SUBMITTED || 0) + (f.SENT_UNCONFIRMED || 0), "Sent in total"]];
  $("#stats").innerHTML = tiles.map(([g, c, n, l]) => `<button class="stat ${c}" data-g="${g}"><div class="n">${n || 0}</div><div class="l">${l}</div></button>`).join("");
  document.querySelectorAll(".stat").forEach(b => b.onclick = () => { switchTab("jobs"); filter = b.dataset.g; cur = 0; render(); });
  const lr = summary.last_run;
  const task = summary.task || {};
  $("#autobar").innerHTML = `
    <span><span class="dot ${st.auto_forms ? "on" : ""}"></span>Forms: ${st.auto_forms ? `auto-send, up to ${st.forms_per_day}/day (${sent.forms || 0} today)` : "wait for you"}</span>
    <span><span class="dot ${st.auto_email ? "on" : ""}"></span>Email applications: ${st.auto_email ? `auto-send, up to ${st.email_per_day}/day (${sent.email || 0} today)` : "wait for you"}</span>
    <span><span class="dot ${st.google ? "on" : ""}"></span>Continue with Google: ${st.google ? "on" : "off"}</span>
    ${lr ? `<span>Last run: ${esc(lr.mode)} ${ago(lr.finished_at || lr.started_at)}${lr.jobs_found ? `, ${lr.jobs_kept} of ${lr.jobs_found} jobs kept` : ""}</span>` : ""}
    ${upd ? `<span>Version ${esc((upd.installed || "?").slice(0, 7))}${upd.busy ? " · updating…" : upd.error ? ` · <span title="${esc(upd.error)}">update held back</span>` : upd.latest && upd.latest !== upd.installed ? " · new version found" : " · up to date"} <button class="link" id="updbtn">Check for updates</button></span>` : ""}
    ${task.running ? `<span class="need">Running now: ${task.what === "login" ? "sign-in window" : "find &amp; apply"}…</span>` : ""}`;
  const ub = $("#updbtn"); if (ub) ub.onclick = checkUpdate;
  const b = $("#ebadge"); b.hidden = !summary.emails_waiting; b.textContent = summary.emails_waiting || "";
  $("#runsprint").disabled = $("#runlogin").disabled = !!task.running;
}

function visible() {
  const q = query.toLowerCase();
  return items.filter(it => inFilter(it) && (!q || `${it.title} ${it.company}`.toLowerCase().includes(q)));
}

function render() {
  if (tab === "platforms") return renderPlatforms();
  if (tab === "results") return renderResults();
  if (tab === "emails") return renderEmails();
  $("#filters").innerHTML = FILTERS.map(([k, l]) => {
    const n = k === "all" ? items.length : items.filter(it => { const g = (STATE[it.state] || {}).group; return k === "todo" ? g !== "sent" : g === k; }).length;
    return `<button data-f="${k}" class="${filter === k ? "on" : ""}">${l} ${n}</button>`;
  }).join("");
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; cur = 0; render(); });
  const vis = visible();
  cur = Math.min(cur, Math.max(0, vis.length - 1));
  $("#list").innerHTML = vis.map((it, i) => `
    <div class="item ${i === cur ? "on" : ""}" data-i="${i}">
      <div class="av">${initial(it.company)}</div>
      <div style="min-width:0">
        <div class="t">${esc(it.title)}</div><div class="c">${esc(it.company || "")}${it.location ? " · " + esc(it.location) : ""}</div>
        <div class="chips">${stateChip(it.state)}${isMail(it) ? '<span class="chip">by email</span>' : ""}
          <span class="chip">${Math.round(it.age_hours || 0)}h old</span>
          ${it.applicant_count != null ? `<span class="chip ${it.applicant_count <= 25 ? "ok" : ""}">${it.applicant_count} applicants</span>` : ""}</div>
      </div>
    </div>`).join("") || `<div class="empty"><b>Nothing here</b>${filter === "todo" ? "Press Find &amp; apply now to look for new jobs." : "Try another filter."}</div>`;
  document.querySelectorAll(".item").forEach(el => el.onclick = () => { cur = +el.dataset.i; render(); });
  renderDetail(vis[cur]);
}

function banner(it) {
  const h = host(it.form_url || it.url);
  switch (it.state) {
    case "READY_TO_SUBMIT": return isMail(it)
      ? `<div class="banner ok">Ready. This job takes applications by email: your CV and the cover letter below go to <b>${esc(h)}</b>.</div>`
      : `<div class="banner ok">Verified ready. Every required field has a value, your tailored CV is attached, and the form shows no errors.</div>`;
    case "NEEDS_USER_INPUT": return `<div class="banner warn">Answer the questions marked <b>needs you</b>, then press Submit.</div>`;
    case "NEEDS_MANUAL_OTP": return `<div class="banner warn"><b>${esc(h)}</b> shows a CAPTCHA, which the agent never solves, so it skipped this one and carried on. Optional: when you're around, press <b>Submit</b> and tick the CAPTCHA; everything else is filled.</div>`;
    case "NEEDS_LOGIN": return `<div class="banner info"><b>${esc(h)}</b> wants you signed in. Press <b>Sign in to sites</b> once (Continue with Google works); the next run fills this form. Or apply yourself with the tailored CV.</div>`;
    case "MANUAL_APPLY": return `<div class="banner plain">No form the agent can fill. Open the application and use your tailored CV.</div>`;
    case "SENT_UNCONFIRMED": return `<div class="banner warn">Submit was pressed but no thank-you page appeared. Check the screenshot; it won't be sent again.</div>`;
    case "SUBMITTED": return `<div class="banner ok">Sent ${ago(it.submitted_at)}${it.error ? ": " + esc(it.error) : ""}.
      ${it.receipt ? `<div class="note" style="margin-top:6px">Receipt: ${it.receipt.confirmation ? "“" + esc(it.receipt.confirmation.slice(0, 200)) + "”" : "no confirmation text"} · <a href="${esc(it.receipt.url)}" target="_blank" rel="noopener">final page</a></div>` : ""}</div>`;
  }
  return "";
}

function answerRows(it) {
  const editable = ["READY_TO_SUBMIT", "NEEDS_USER_INPUT"].includes(it.state);
  return it.answers.filter(a => !(isMail(it) && a.label === "Cover letter")).map(a => {
    let v;
    if (a.consent) v = editable ? `<label><input type="checkbox" data-consent="${esc(a.label)}"> I agree</label>` : esc(a.value ?? "");
    else if (a.kind === "file") v = esc(a.value || "") + (a.value ? "" : ' <span class="need">left empty</span>');
    else if (editable && (a.needs_user || a.source === "ai_draft")) {
      if (a.options && a.options.length) v = `<select data-ov="${esc(a.label)}"><option value="">Choose…</option>${a.options.map(o => `<option ${o === a.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
      else if (a.kind === "textarea" || a.source === "ai_draft") v = `<textarea data-ov="${esc(a.label)}">${esc(a.value || "")}</textarea>`;
      else v = `<input data-ov="${esc(a.label)}" value="${esc(a.value || "")}">`;
    } else v = esc(a.value ?? "");
    const flag = a.needs_user ? '<span class="chip warn">needs you</span>' : a.consent ? '<span class="chip info">consent</span>'
      : a.source === "ai_draft" ? '<span class="chip info">AI draft</span>' : `<span class="note">${esc(a.source || "")}</span>`;
    return `<tr><td class="q">${esc(a.label)}${a.required ? " *" : ""}${a.note ? `<div class="note">${esc(a.note)}</div>` : ""}</td><td class="v">${v}</td><td class="flag">${flag}</td></tr>`;
  }).join("");
}

function renderDetail(it) {
  if (!it) { $("#detail").innerHTML = `<div class="empty"><b>Nothing to review</b>New jobs appear here after each run.</div>`; return; }
  const canSubmit = ["READY_TO_SUBMIT", "NEEDS_USER_INPUT", "NEEDS_MANUAL_OTP"].includes(it.state);
  const open = ["MANUAL_APPLY", "NEEDS_LOGIN", "NEEDS_MANUAL_OTP", "SENT_UNCONFIRMED"].includes(it.state);
  const letter = isMail(it) ? (it.answers.find(a => a.label === "Cover letter") || {}).value : null;
  const rows = answerRows(it);
  const pct = x => Math.round((x || 0) * 100);
  $("#detail").innerHTML = `
    <div class="dh"><div class="av">${initial(it.company)}</div><div style="min-width:0">
      <h2>${esc(it.title)}</h2>
      <div class="meta">${esc(it.company || "")}${it.location ? " · " + esc(it.location) : ""} · posted ${Math.round(it.age_hours || 0)}h ago · via ${esc(host(it.url) || it.source)}</div>
      <div class="scores">
        <div class="score"><div class="l">Priority</div><div class="v">${pct(it.priority_score)}</div><div class="bar"><i style="width:${pct(it.priority_score)}%"></i></div></div>
        <div class="score"><div class="l">Fit</div><div class="v">${pct(it.fit_score)}</div><div class="bar"><i style="width:${pct(it.fit_score)}%"></i></div></div>
        <div class="score"><div class="l">Applicants</div><div class="v">${it.applicant_count ?? "?"}</div></div>
        <div class="score"><div class="l">CV track</div><div class="v">${esc(it.track || "")}</div></div>
      </div></div></div>
    ${banner(it)}
    <div class="row">
      ${canSubmit ? `<button class="btn primary" id="submit">${isMail(it) ? "Send email application" : "Submit"} <span class="kbd">Enter</span></button>` : ""}
      ${open ? `<a class="btn primary" href="${esc(it.form_url && !isMail(it) ? it.form_url : it.url)}" target="_blank" rel="noopener">Open application</a>
                <button class="btn" id="done">${it.state === "SENT_UNCONFIRMED" ? "Yes, it was sent" : "I applied myself"}</button>` : ""}
      ${it.has_cv ? `<a class="btn" href="/files/cv/${it.id}">Download CV</a>` : ""}
      <a class="btn" href="${esc(it.url)}" target="_blank" rel="noopener">Job post</a>
      ${it.state !== "SUBMITTED" ? `<button class="btn ghost" id="skip">Skip <span class="kbd">⌫</span></button>` : ""}
    </div>
    ${it.missing.length ? `<p class="need">Still needed: ${it.missing.map(esc).join(", ")}</p>` : ""}
    ${letter != null ? `<h3>Cover letter</h3><textarea class="big" data-ov="Cover letter" ${canSubmit ? "" : "readonly"}>${esc(letter)}</textarea>` : ""}
    ${rows ? `<h3>${isMail(it) ? "Email" : "Answers on the form"}</h3><table>${rows}</table>` : ""}
    ${it.matched_keywords ? `<h3>CV keywords matched</h3><div class="chips">${String(it.matched_keywords).split(/,\s*/).slice(0, 24).map(k => `<span class="chip">${esc(k)}</span>`).join("")}</div>` : ""}
    <details id="why"><summary>Why this job</summary><div class="note">Loading…</div></details>
    <details id="rec"><summary>Application record</summary><div class="note">Loading…</div></details>
    ${it.has_shot ? `<details><summary>Screenshot of the filled form</summary><img class="shot" src="/files/screenshot/${it.id}" alt="Filled application form"></details>` : ""}`;
  $("#why").ontoggle = () => $("#why").open && loadWhy(it.id);
  $("#rec").ontoggle = () => $("#rec").open && loadRecord(it.id);
  if ($("#skip")) $("#skip").onclick = skip;
  if ($("#submit")) $("#submit").onclick = submit;
  if ($("#done")) $("#done").onclick = () => post(`/api/applied_myself/${it.id}`).then(() => { say("Marked as sent."); load(); });
}

async function loadWhy(sid) {
  const box = $("#why > div"); if (!box || box.dataset.done) return;
  const x = await fetch(`/api/explain/${sid}`).then(r => r.json()).catch(() => null);
  if (!x) { box.textContent = "Couldn't load the explanation."; return; }
  const li = (rs, cls) => rs.length ? `<ul class="req">${rs.map(r => `<li class="${cls}">${esc(r.text)}${r.because && r.because.length ? ` <span class="note">(${esc(r.because.join(", "))})</span>` : ""}</li>`).join("")}</ul>` : `<p class="note">None listed.</p>`;
  box.dataset.done = 1;
  box.className = "";
  box.innerHTML = `${x.reasons.length ? `<ul>${x.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    <h4>What you have that they ask for (${x.requirements_met.length})</h4>${li(x.requirements_met, "ok")}
    <h4>What they ask that your CV doesn't show (${x.requirements_missing.length})</h4>${li(x.requirements_missing, "miss")}
    <p class="note">Scores: fit ${Math.round(x.scores.fit * 100)}, freshness ${Math.round(x.scores.recency * 100)}, few applicants ${Math.round(x.scores.low_applicants * 100)}.</p>`;
}

async function loadRecord(sid) {
  const box = $("#rec > div"); if (!box || box.dataset.done) return;
  const x = await fetch(`/api/record/${sid}`).then(r => r.json()).catch(() => null);
  if (!x) { box.textContent = "Couldn't load the record."; return; }
  const p = x.posting || {}, rc = x.receipt;
  box.dataset.done = 1; box.className = "";
  box.innerHTML = `
    <p><b>Sent:</b> ${x.submitted_at ? esc(new Date(x.submitted_at).toLocaleString()) : "not yet"} ${x.applied_to ? `to ${esc(x.applied_to.replace(/^mailto:/, ""))}` : ""}</p>
    ${rc ? `<p><b>Receipt:</b> ${esc(rc.confirmation || "no confirmation text")}${rc.url ? ` · <a href="${esc(rc.url)}" target="_blank" rel="noopener">page</a>` : ""}</p>` : ""}
    ${x.follow_up ? `<p><b>Follow-up:</b> sent ${esc(new Date(x.follow_up.sent_at).toLocaleString())}</p>` : ""}
    ${x.replies.length ? `<p><b>Replies:</b></p><ul>${x.replies.map(m => `<li>${esc(m.subject)} <span class="note">${esc(m.from_addr)} · ${esc(ago(m.received_at))}</span></li>`).join("")}</ul>` : ""}
    <p><b>CV:</b> ${esc(x.cv.file || "—")} (${esc(x.cv.track || "")} track)</p>
    <details><summary>The job post as it was${p.captured_at ? ` on ${esc(new Date(p.captured_at).toLocaleDateString())}` : ""}</summary><pre class="post">${esc(p.description || "")}</pre></details>`;
}

async function renderResults() {
  $("#filters").innerHTML = ""; $("#list").innerHTML = "";
  const r = await fetch("/api/results").then(x => x.json()).catch(() => null);
  if (!r) { $("#detail").innerHTML = `<p class="note">Couldn't load results.</p>`; return; }
  const f = r.funnel, steps = [["Found", f.found], ["Good fit", f.qualified], ["Filled", f.staged], ["Sent", f.sent], ["Replied", f.replied], ["Interviews", f.interviews], ["Offers", f.offers]];
  const max = Math.max(1, ...steps.map(s => s[1]));
  const chip = s => ({ interview: "ok", offer: "ok", rejected: "", replied: "info", waiting: "" })[s] ?? "";
  $("#list").innerHTML = `<div class="tools"><p class="note">Last ${r.days} days</p></div>` + Object.entries(r.by_source).map(([s, v]) =>
    `<div class="item"><div style="min-width:0"><div class="t">${esc(s)}</div><div class="c">${v.sent} sent · ${v.replied} answered</div></div></div>`).join("");
  $("#detail").innerHTML = `<h2>Results</h2>
    <div class="funnel">${steps.map(([l, n]) => `<div class="fstep"><span class="fl">${l}</span><span class="fbar"><i style="width:${Math.round(n / max * 100)}%"></i></span><b>${n}</b></div>`).join("")}</div>
    <p class="note">${r.response_rate == null ? "No applications sent yet." : `Response rate ${Math.round(r.response_rate * 100)}%.`} A follow-up email goes out by itself after 7 days with no answer (email applications only, once).</p>
    <h3>Applications</h3>
    ${r.applications.length ? `<table>${r.applications.map(a => `<tr><td class="q">${esc(a.title)}<div class="note">${esc(a.company || "")} · ${a.method} · ${esc(ago(a.submitted_at))}</div></td>
      <td><span class="chip ${chip(a.status)}">${a.status}</span>${a.follow_up_due ? ' <span class="chip warn">follow-up due</span>' : a.followed_up ? ' <span class="chip">followed up</span>' : ""}</td></tr>`).join("")}</table>` : `<p class="note">Nothing sent in this period.</p>`}`;
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

async function submit() {
  const it = visible()[cur]; if (!it || busy || !["READY_TO_SUBMIT", "NEEDS_USER_INPUT", "NEEDS_MANUAL_OTP"].includes(it.state)) return;
  const overrides = {}, consents = [];
  document.querySelectorAll("[data-ov]").forEach(el => { if (el.value) overrides[el.dataset.ov] = el.value; });
  document.querySelectorAll("[data-consent]").forEach(el => { if (el.checked) consents.push(el.dataset.consent); });
  const unticked = [...document.querySelectorAll("[data-consent]")].filter(e => !e.checked).length;
  if (unticked && !confirm(`${unticked} consent box(es) are not ticked. The form may refuse to submit. Continue?`)) return;
  busy = true; say(isMail(it) ? "Sending the email…" : "Submitting… a browser window opens. Solve any CAPTCHA there.", 60000);
  try {
    const r = await post(`/api/submit/${it.id}`, { overrides, consents });
    say(r.ok ? "Sent." : "Not sent: " + (r.error || "unknown"), 8000);
  } catch (e) { say("Error: " + e.message, 8000); }
  busy = false; load();
}

async function skip() {
  const it = visible()[cur]; if (!it || busy) return;
  await post(`/api/skip/${it.id}`); say("Skipped."); load();
}

$("#sendall").onclick = async () => {
  const n = items.filter(i => i.state === "READY_TO_SUBMIT").length;
  if (!n) return say("No verified applications to submit.");
  if (!confirm(`Submit all ${n} verified applications now? Each form is checked again before Submit; forms with a CAPTCHA or a consent box you haven't allowed stay here.`)) return;
  try { await post("/api/submit_all"); } catch (e) { return say("Error: " + e.message, 8000); }
  say("Sending… browser windows open one by one. This page updates when it's done.", 600000);
  const poll = setInterval(async () => {
    const st = await fetch("/api/submit_all").then(r => r.json());
    if (!st.running) { clearInterval(poll); const r = st.result || {};
      say(`Done: ${r.sent || 0} sent, ${r.not_confirmed || 0} sent without a thank-you page, ${r.failed || 0} failed, ${r.waiting_for_you || 0} still need you.`, 15000); load(); }
  }, 4000);
};
const runTask = async (what, text) => {
  try { await post(`/api/run/${what}`); say(text, 12000); } catch (e) { say("Error: " + e.message, 8000); }
  load();
};
$("#runsprint").onclick = () => confirm("Read your inbox, find new jobs, fill forms and send the complete ones now?") &&
  runTask("sprint", "Started in a new window. This page refreshes as results come in.");
$("#runlogin").onclick = () => runTask("login", "A browser opened. Sign in to Google first, then use Continue with Google on each site. Close it when done.");
setInterval(() => { if (tab === "jobs" && !busy && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) load(); }, 30000);

async function renderEmails() {
  emails = await fetch("/api/emails").then(r => r.json());
  $("#filters").innerHTML = ""; $("#q").hidden = true;
  ecur = Math.min(ecur, Math.max(0, emails.length - 1));
  $("#list").innerHTML = emails.map((m, i) => `
    <div class="item ${i === ecur ? "on" : ""}" data-e="${i}">
      <div class="av">${initial(m.from_name || m.from_addr)}</div>
      <div style="min-width:0"><div class="t">${esc(m.subject || "(no subject)")}</div><div class="c">${esc(m.from_name || m.from_addr)} · ${ago(m.received_at)}</div>
      <div class="chips">${m.state === "SENT" ? '<span class="chip ok">replied</span>' : (m.draft_reply || "").includes("[FILL IN") ? '<span class="chip warn">needs you</span>' : '<span class="chip info">draft ready</span>'}
        <span class="chip">${esc((m.category || "other").replace("_", " "))}</span></div></div>
    </div>`).join("") || '<div class="empty"><b>No recruiter emails</b>Replies to recruiters show up here.</div>';
  document.querySelectorAll("[data-e]").forEach(el => el.onclick = () => { ecur = +el.dataset.e; renderEmails(); });
  const m = emails[ecur];
  if (!m) { $("#detail").innerHTML = '<div class="empty"><b>Nothing here yet</b>The agent checks your inbox on every run.</div>'; return; }
  const sent = m.state === "SENT", gap = (m.draft_reply || "").includes("[FILL IN");
  $("#detail").innerHTML = `
    <div class="dh"><div class="av">${initial(m.from_name || m.from_addr)}</div><div style="min-width:0">
      <h2>${esc(m.subject || "(no subject)")}</h2>
      <div class="meta">${esc(m.from_name || "")} &lt;${esc(m.from_addr)}&gt; · ${ago(m.received_at)} · ${esc((m.category || "other").replace("_", " "))}</div></div></div>
    ${sent ? `<div class="banner ok">Replied ${ago(m.sent_at)}.</div>`
      : gap ? `<div class="banner warn">Fill the [FILL IN …] gaps, then press Send. Drafts with gaps are never sent automatically.</div>`
            : `<div class="banner info">Draft ready. It's sent on the next run if automatic replies are on, or press Send now.</div>`}
    <h3>Their email</h3><pre class="mail">${esc(m.body_text || "")}</pre>
    <h3>${sent ? "Your reply" : "Your reply (edit freely)"}</h3>
    <textarea class="big" id="reply" ${sent ? "readonly" : ""}>${esc(m.draft_reply || "")}</textarea>
    <div class="row">${sent ? "" : '<button class="btn primary" id="esend">Send reply</button><button class="btn ghost" id="edismiss">Not a recruiter, hide</button>'}</div>`;
  if (!sent) {
    $("#esend").onclick = async () => {
      if (!confirm(`Send this reply to ${m.from_addr}?`)) return;
      try { const r = await post(`/api/emails/${m.id}/send`, { body: $("#reply").value }); say(r.ok ? "Reply sent." : "Not sent: " + r.error, 8000); }
      catch (e) { say("Error: " + e.message, 8000); }
      renderEmails(); load();
    };
    $("#edismiss").onclick = () => post(`/api/emails/${m.id}/dismiss`).then(renderEmails);
  }
}

async function renderPlatforms() {
  const ps = await fetch("/api/platforms").then(r => r.json());
  $("#filters").innerHTML = ""; $("#q").hidden = true;
  $("#list").innerHTML = '<div class="empty"><b>AI training platforms</b>These take one standing application instead of dated job posts. Apply once, then mark it.</div>';
  $("#detail").innerHTML = `<h2>AI training platforms</h2><p class="meta">${ps.filter(p => p.status !== "NOT_APPLIED").length} of ${ps.length} done</p>
    <table><tr><th>Platform</th><th>Status</th><th></th></tr>${ps.map(p => `
    <tr><td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a></td>
    <td>${p.status === "NOT_APPLIED" ? '<span class="chip warn">not applied</span>' : '<span class="chip ok">applied</span>'}</td>
    <td style="text-align:right">${p.status === "NOT_APPLIED" ? `<button class="btn" data-p="${esc(p.name)}">Mark applied</button>` : ""}</td></tr>`).join("")}</table>`;
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => { await post(`/api/platforms/${encodeURIComponent(b.dataset.p)}`, { status: "APPLIED" }); renderPlatforms(); });
}

function switchTab(t) {
  tab = t; $("#q").hidden = t !== "jobs";
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x.dataset.tab === t));
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { switchTab(b.dataset.tab); render(); });
$("#q").oninput = e => { query = e.target.value; cur = 0; render(); };
document.addEventListener("keydown", e => {
  if (tab !== "jobs" || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
  const n = visible().length;
  if (e.key === "ArrowDown") { cur = Math.min(n - 1, cur + 1); render(); e.preventDefault(); }
  if (e.key === "ArrowUp") { cur = Math.max(0, cur - 1); render(); e.preventDefault(); }
  if (e.key === "Enter") { submit(); e.preventDefault(); }
  if (e.key === "Backspace") { skip(); e.preventDefault(); }
});
load();
</script>
</body>
</html>
